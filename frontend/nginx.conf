server {
    listen 80;
    server_name localhost;

    # Gzip 압축 설정
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 헬스체크 엔드포인트
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"frontend"}';
    }

    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"frontend"}';
    }

    # 상품 서비스 프록시 (/api/products -> product-service:8000/products)
    location /api/products {
        proxy_pass http://product-service:8000/products;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 주문 서비스 프록시 (/api/orders -> order-service:8000/orders)
    location /api/orders {
        proxy_pass http://order-service:8000/orders;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 정적 파일 서빙 및 SPA 라우팅
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
