# [주의] 이 파일은 템플릿입니다. 실제 운영/배포 시에는 비밀번호를 변경하여 적용하거나
# kubectl create secret 명령어를 통해 클러스터에 직접 시크릿을 생성하십시오.
# 
# 명령어 예시:
# kubectl create secret generic msa-postgres-secret \
#   --namespace=msa-demo \
#   --from-literal=POSTGRES_USER=msa_user \
#   --from-literal=POSTGRES_PASSWORD=YOUR_STRONG_PASSWORD \
#   --from-literal=POSTGRES_DB=orders_db \
#   --from-literal=DATABASE_URL="postgresql://msa_user:YOUR_STRONG_PASSWORD@postgres-service:5432/orders_db"

apiVersion: v1
kind: Secret
metadata:
  name: msa-postgres-secret
  namespace: msa-demo
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: msa-order-system
type: Opaque
stringData:
  POSTGRES_USER: "msa_user"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "orders_db"
  DATABASE_URL: "postgresql://msa_user:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/orders_db"
